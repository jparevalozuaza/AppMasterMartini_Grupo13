
services:
  mysql-recetas:
    image: mysql:8.4
    container_name: mysql-mastermartini
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: master_martini_recetas
      MYSQL_USER: martini_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - datos_recetas:/var/lib/mysql

volumes:
  datos_recetas:
