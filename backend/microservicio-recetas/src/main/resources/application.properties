
spring.application.name=microservicio-recetas

# Conexion con MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/master_martini_recetas
spring.datasource.username=martini_app
spring.datasource.password=${MYSQL_PASSWORD}

# Configuracion de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto del servidor
server.port=8080
